<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rapla GraphQL API — GraphiQL</title>
    <!--
      PRD 035: GraphiQL with OAuth shared via the Angular SPA's /app/login.
      Design: ONE OAuth callback URI per IdP (the SPA's /app/auth/callback,
      already registered), not one per explorer. GraphiQL has no callback of
      its own; it reads the access_token the SPA places in localStorage (via
      angular-oauth2-oidc) after the user signs in via /app/login.

      Trade-off: GraphiQL can't initiate its own OAuth flow, so signing in is
      a 2-step ritual:
        (1) click "Log in via rapla SPA" → opens /app/login in a new tab
        (2) sign in there with whichever provider (rapla, Microsoft, Keycloak, Google)
        (3) return to this tab + click reload (button on the auth bar)
      The SPA already supports all four providers; GraphiQL inherits all four
      for free with zero per-provider IdP-admin work.

      Same mechanism works for production: SPA at /app/login on the deployed
      host, OAuth callback at /app/auth/callback (already registered in
      every IdP), GraphiQL inherits authorization purely via localStorage.

      Offline self-host fallback: npm install graphiql react react-dom + copy
      umd/min builds into this directory and switch import URLs to relative.
    -->
    <link rel="stylesheet" href="https://esm.sh/graphiql@5.2.1/dist/style.css" />
    <link rel="stylesheet" href="https://esm.sh/@graphiql/plugin-explorer@5.1.1/dist/style.css" />
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .auth-bar { padding: 6px 12px; background: #1e2937; color: #fff; display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
        .auth-bar .label { opacity: 0.7; }
        .auth-bar .principal { font-family: monospace; opacity: 0.9; }
        .auth-bar a, .auth-bar button { background: #2563eb; color: #fff; border: 0; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
        .auth-bar a:hover, .auth-bar button:hover { background: #1d4ed8; }
        .auth-bar button.secondary { background: #6b7280; }
        .auth-bar button.secondary:hover { background: #4b5563; }
        #graphiql { flex: 1; min-height: 0; }
        .loading { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #6b7280; }
    </style>
    <script type="importmap">
        {
          "imports": {
            "react": "https://esm.sh/react@19.1.0",
            "react/": "https://esm.sh/react@19.1.0/",
            "react-dom": "https://esm.sh/react-dom@19.1.0",
            "react-dom/": "https://esm.sh/react-dom@19.1.0/",
            "graphiql": "https://esm.sh/graphiql@5.2.1?standalone&external=react,react-dom,@graphiql/react,graphql",
            "graphiql/": "https://esm.sh/graphiql@5.2.1/",
            "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.1?standalone&external=react,@graphiql/react,graphql",
            "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.2?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
            "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.11.3?standalone&external=graphql",
            "graphql": "https://esm.sh/graphql@16.11.0",
            "@emotion/is-prop-valid": "data:text/javascript,"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div id="auth-bar" class="auth-bar"></div>
    <div id="graphiql"><div class="loading">Loading GraphiQL…</div></div>
</div>
<script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { GraphiQL } from 'graphiql';
    import { createGraphiQLFetcher } from '@graphiql/toolkit';
    import { explorerPlugin } from '@graphiql/plugin-explorer';
    import 'graphiql/setup-workers/esm.sh';

    // angular-oauth2-oidc stores the access_token here after the SPA login
    // completes (any provider — rapla, Microsoft, Keycloak, Google).
    function getToken() {
        return localStorage.getItem('access_token') || null;
    }

    function logout() {
        // Don't clear other angular-oauth2-oidc keys (id_token, expires_at, …)
        // — that would log the user out of the SPA too. Just drop the token
        // for GraphiQL's purposes; the SPA's auto-refresh will reissue if
        // it's still active in another tab.
        localStorage.removeItem('access_token');
        location.reload();
    }

    function renderAuthBar() {
        const bar = document.getElementById('auth-bar');
        bar.innerHTML = '';
        const token = getToken();
        if (token) {
            // Decode the JWT 'sub' / 'preferred_username' for display.
            // No signature check; purely cosmetic — server validates every request.
            let display = '(unknown)';
            try {
                const payload = JSON.parse(atob(token.split('.')[1]
                    .replaceAll('-','+').replaceAll('_','/')));
                display = payload.preferred_username || payload.sub || display;
            } catch { /* ignore */ }

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = 'authenticated as';
            const principal = document.createElement('span');
            principal.className = 'principal';
            principal.textContent = display;
            const out = document.createElement('button');
            out.className = 'secondary';
            out.textContent = 'Drop token';
            out.onclick = logout;
            bar.append(label, principal, out);
        } else {
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = 'anonymous — sign in via the SPA:';
            // PRD 035: ?returnTo=graphiql routes the SPA back to /graphiql
            // after the OAuth flow completes, via the LOGIN_RETURN_PATHS
            // allowlist (rapla-angular/src/app/auth/login-return-to.ts).
            // Same-tab navigation; the SPA's callback brings the browser
            // back here automatically.
            const loginLink = document.createElement('a');
            loginLink.href = '/app/login?returnTo=graphiql';
            loginLink.textContent = 'Log in via rapla SPA';
            bar.append(label, loginLink);
        }
    }

    // Auth-aware fetcher with three properties:
    //   1. Reads localStorage on EVERY request (not baked-in at page load) —
    //      auto-picks-up SPA token refreshes without a GraphiQL reload.
    //   2. On 401 with a present token: drop the stale token + bounce to
    //      /app/login to re-auth. The returnTo brings the user back.
    //      Skipped if the user is intentionally anonymous (no token).
    //   3. Custom `fetch` keeps the rest of createGraphiQLFetcher's behavior
    //      (subscriptions, multipart, etc.).
    const fetcher = createGraphiQLFetcher({
        url: '/api/graphql',
        fetch: async (input, init) => {
            init = init || {};
            init.headers = { ...(init.headers || {}) };
            const token = getToken();
            if (token) init.headers['Authorization'] = 'Bearer ' + token;
            const response = await fetch(input, init);
            if (response.status === 401 && token) {
                localStorage.removeItem('access_token');
                location.href = '/app/login?returnTo=graphiql';
                throw new Error('Token expired — redirecting to login');
            }
            return response;
        }
    });

    renderAuthBar();

    // Cross-tab reactivity: when the SPA refreshes / drops the token in
    // another tab, re-render the auth bar in this tab so the principal
    // display stays current. The fetcher itself is already reactive.
    window.addEventListener('storage', (e) => {
        if (e.key === 'access_token') renderAuthBar();
    });

    const explorer = explorerPlugin();
    ReactDOM.createRoot(document.getElementById('graphiql'))
        .render(React.createElement(GraphiQL, { fetcher, plugins: [explorer] }));
</script>
</body>
</html>
