<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rapla GraphQL API — GraphiQL</title>
    <!--
      PRD 035: GraphiQL explorer for the rapla GraphQL API.

      PRD 071 Phase 3: this page itself requires an authenticated session —
      reaching it at all means SecurityConfig let you through (an anonymous
      browser GET is rejected 401). The same form-login / SPA-OAuth session
      that gates this page is what authorises the queries below.

      PRD 072 Phase 3: GraphiQL no longer piggybacks on the SPA's
      localStorage access_token Bearer. It relies on the HttpOnly
      `access_token` cookie (Phase 2) that the browser sends automatically
      with same-origin fetches. The fetcher does a plain same-origin fetch;
      on a 401 it calls POST /api/auth/refresh (which reads the path-scoped
      refresh_token cookie and sets a fresh access_token cookie) and replays
      the request once; if the refresh itself 401s, it bounces to /login.

      POST /api/graphql is a MUTATING cookie-auth request, so it must carry
      the CSRF double-submit token: the X-XSRF-TOKEN header read from the
      non-HttpOnly XSRF-TOKEN cookie that Spring's
      CookieCsrfTokenRepository.withHttpOnlyFalse() sets (gated by
      CookieAuthCsrfMatcher).

      Offline self-host fallback: npm install graphiql react react-dom + copy
      umd/min builds into this directory and switch import URLs to relative.
    -->
    <link rel="stylesheet" href="https://esm.sh/graphiql@5.2.1/dist/style.css" />
    <link rel="stylesheet" href="https://esm.sh/@graphiql/plugin-explorer@5.1.1/dist/style.css" />
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .auth-bar { padding: 6px 12px; background: #1e2937; color: #fff; display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
        .auth-bar .label { opacity: 0.7; }
        .auth-bar a { background: #374151; color: #fff; border: 0; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
        .auth-bar a:hover { background: #4b5563; }
        .auth-bar .schema-link { margin-left: auto; }
        #graphiql { flex: 1; min-height: 0; }
        .loading { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #6b7280; }
    </style>
    <script type="importmap">
        {
          "imports": {
            "react": "https://esm.sh/react@19.1.0",
            "react/": "https://esm.sh/react@19.1.0/",
            "react-dom": "https://esm.sh/react-dom@19.1.0",
            "react-dom/": "https://esm.sh/react-dom@19.1.0/",
            "graphiql": "https://esm.sh/graphiql@5.2.1?standalone&external=react,react-dom,@graphiql/react,graphql",
            "graphiql/": "https://esm.sh/graphiql@5.2.1/",
            "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.1?standalone&external=react,@graphiql/react,graphql",
            "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.2?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
            "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.11.3?standalone&external=graphql",
            "graphql": "https://esm.sh/graphql@16.11.0",
            "@emotion/is-prop-valid": "data:text/javascript,"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div id="auth-bar" class="auth-bar"></div>
    <div id="graphiql"><div class="loading">Loading GraphiQL…</div></div>
</div>
<script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { GraphiQL } from 'graphiql';
    import { createGraphiQLFetcher } from '@graphiql/toolkit';
    import { explorerPlugin } from '@graphiql/plugin-explorer';
    import 'graphiql/setup-workers/esm.sh';

    // Read the non-HttpOnly XSRF-TOKEN cookie that Spring's
    // CookieCsrfTokenRepository.withHttpOnlyFalse() sets. POST /api/graphql is
    // a mutating cookie-auth request, so CookieAuthCsrfMatcher requires the
    // matching X-XSRF-TOKEN header (double-submit). The access_token cookie
    // itself is HttpOnly and unreadable here — the browser attaches it
    // automatically to same-origin fetches, which is the whole point.
    function getXsrfToken() {
        const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : null;
    }

    function renderAuthBar() {
        const bar = document.getElementById('auth-bar');
        bar.innerHTML = '';
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = 'authenticated via access_token cookie';
        bar.append(label);

        // Always-visible link to the full SDL schema dump (the GraphQL pendant
        // to Swagger's /v3/api-docs). Public, UTF-8. Opens in a new tab.
        const schemaLink = document.createElement('a');
        schemaLink.className = 'schema-link';
        schemaLink.href = '/api/graphql/schema';
        schemaLink.target = '_blank';
        schemaLink.rel = 'noopener';
        schemaLink.textContent = 'Schema (SDL) ↗';
        bar.append(schemaLink);

        // PRD 072 Phase 4: cookie-model sign-out — the old "Drop token" button
        // (which cleared the localStorage access_token) is meaningless now that the
        // credential is an HttpOnly cookie JS can't touch. Instead POST the server
        // logout (clears both cookies) with the double-submit XSRF header, then land
        // on the combined /login page.
        const signOut = document.createElement('a');
        signOut.className = 'schema-link';
        signOut.href = '#';
        signOut.textContent = 'Sign out';
        signOut.addEventListener('click', async (e) => {
            e.preventDefault();
            const xsrf = getXsrfToken();
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: xsrf ? { 'X-XSRF-TOKEN': xsrf } : {},
            }).catch(() => {});
            window.location.assign('/login');
        });
        bar.append(signOut);
    }

    // Auth-aware fetcher (PRD 072 Phase 3):
    //   1. Plain same-origin fetch — the HttpOnly access_token cookie is sent
    //      automatically by the browser; no Bearer header needed.
    //   2. POST /api/graphql is mutating cookie-auth → attach X-XSRF-TOKEN from
    //      the XSRF-TOKEN cookie so CookieAuthCsrfMatcher is satisfied.
    //   3. On 401: POST /api/auth/refresh (reads the path-scoped refresh_token
    //      cookie, sets a fresh access_token cookie), then replay the request
    //      once. If the refresh itself 401s, redirect to /login.
    const fetcher = createGraphiQLFetcher({
        url: '/api/graphql',
        fetch: async (input, init) => {
            const doFetch = () => {
                const opts = { ...(init || {}) };
                opts.credentials = 'same-origin';
                opts.headers = { ...((init && init.headers) || {}) };
                const xsrf = getXsrfToken();
                if (xsrf) opts.headers['X-XSRF-TOKEN'] = xsrf;
                return fetch(input, opts);
            };

            let response = await doFetch();
            if (response.status === 401) {
                const refresh = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: (() => {
                        const x = getXsrfToken();
                        return x ? { 'X-XSRF-TOKEN': x } : {};
                    })()
                });
                if (refresh.status === 401) {
                    location.href = '/login';
                    throw new Error('Session expired — redirecting to login');
                }
                response = await doFetch();
            }
            return response;
        }
    });

    renderAuthBar();

    const explorer = explorerPlugin();
    ReactDOM.createRoot(document.getElementById('graphiql'))
        .render(React.createElement(GraphiQL, { fetcher, plugins: [explorer] }));
</script>
</body>
</html>
