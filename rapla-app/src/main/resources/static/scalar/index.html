<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rapla REST API — Scalar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      PRD 041 + PRD 035: Scalar API Reference. CDN-loaded — see PRD 041 OQ5
      for why (scalar-webmvc drags Jackson 2; webjar has nanoid conflicts).

      Auth: shared via the Angular SPA's /app/login (PRD 035). Scalar no
      longer runs its own in-UI OAuth flow — instead the Bearer security
      scheme is pre-filled from localStorage.access_token set by the SPA
      after the user signs in. Same payoff as for GraphiQL and Swagger UI:
        - no /scalar/index.html callback URI registered per IdP
        - all 4 providers (rapla, Microsoft, Keycloak, Google) work for free
          via the SPA's already-registered /app/auth/callback

      Offline / self-hosted fallback (if jsdelivr access is blocked):
        1. Add an npm install step under rapla-app (or fold into rapla-angular's
           package.json) for `@scalar/api-reference@1.57.1`. Use frontend-maven-plugin
           — same pattern as the `spa` profile in rapla-app/pom.xml.
        2. Copy `node_modules/@scalar/api-reference/dist/browser/standalone.js` to
           src/main/resources/static/scalar/standalone.js during build.
        3. Change the script src below to "/scalar/standalone.js".
    -->
    <style>
        /* Scalar's "modern" layout fills the viewport with its own root, so a
           normal in-flow auth bar gets covered or pushed off-screen. Pin it
           fixed at the top and offset the body to make room. */
        body { margin: 0; font-family: system-ui, sans-serif; padding-top: 36px; }
        .auth-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 99999; padding: 6px 12px; background: #1e2937; color: #fff; display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; height: 24px; box-sizing: content-box; }
        .auth-bar .label { opacity: 0.7; }
        .auth-bar .principal { font-family: monospace; opacity: 0.9; }
        .auth-bar a, .auth-bar button { background: #2563eb; color: #fff; border: 0; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
        .auth-bar a:hover, .auth-bar button:hover { background: #1d4ed8; }
        .auth-bar button.secondary { background: #6b7280; }
        .auth-bar button.secondary:hover { background: #4b5563; }
    </style>
</head>
<body>
<div id="auth-bar" class="auth-bar"></div>
<!--
  Multi-source dropdown comes from the `sources` array passed to
  Scalar.createApiReference below. Each source URL is served by
  StaticOpenApiController from src/main/resources/openapi/*.json
  (regenerated via OpenApiSpecCaptureTest).
-->
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.57.1"></script>
<script>
    function getToken() { return localStorage.getItem('access_token') || null; }
    function logout() { localStorage.removeItem('access_token'); location.reload(); }

    function renderAuthBar() {
        var bar = document.getElementById('auth-bar');
        bar.innerHTML = '';
        var token = getToken();
        if (token) {
            var display = '(unknown)';
            try {
                var payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                display = payload.preferred_username || payload.sub || display;
            } catch (e) { /* ignore */ }
            var label = document.createElement('span'); label.className = 'label'; label.textContent = 'authenticated as';
            var principal = document.createElement('span'); principal.className = 'principal'; principal.textContent = display;
            var out = document.createElement('button'); out.className = 'secondary'; out.textContent = 'Drop token'; out.onclick = logout;
            bar.append(label, principal, out);
        } else {
            var label = document.createElement('span'); label.className = 'label';
            label.textContent = 'anonymous — sign in via the SPA:';
            var loginLink = document.createElement('a');
            loginLink.href = '/app/login?returnTo=scalar';
            loginLink.textContent = 'Log in via rapla SPA';
            bar.append(label, loginLink);
        }
    }
    renderAuthBar();

    // Cross-tab reactivity: when the SPA refreshes / drops the token in
    // another tab, reload this page so Scalar's baked-in bearer token is
    // rebuilt from the new localStorage value. (Scalar's authentication
    // config is captured once at createApiReference time, unlike Swagger's
    // per-request requestInterceptor — so a full reload is the cleanest way
    // to refresh.)
    window.addEventListener('storage', function (e) {
        if (e.key === 'access_token') location.reload();
    });

    // Wrap window.fetch BEFORE Scalar loads so every API call goes through
    // our interceptor. This:
    //   1. FORCE-injects the current localStorage token as Bearer on /api/*
    //      calls — overrides any Authorization header Scalar already set
    //      (Scalar attaches the OpenAPI-declared oauth2 scheme's empty token
    //      to operations that require oauth2; if we don't override, the empty
    //      header wins and the call goes anonymous).
    //   2. On 401 with a token present (stale), drops it and bounces to
    //      /app/login with returnTo=scalar. Anonymous 401s pass through.
    //
    //   Handles all three header-passing patterns fetch supports:
    //     - plain object:  { 'Authorization': '...' }
    //     - Headers object: new Headers({ ... })
    //     - Request object (input is Request, init is ignored)
    var originalFetch = window.fetch;
    window.fetch = function (input, init) {
        var t = getToken();
        var url;
        try {
            url = new URL((input instanceof Request) ? input.url : input, location.href);
        } catch (e) { return originalFetch(input, init); }
        var isApi = url.pathname.startsWith('/api/');

        if (t && isApi) {
            if (input instanceof Request) {
                // Clone to a mutable Headers object; Request.headers is read-only on the original.
                var h = new Headers(input.headers);
                h.set('Authorization', 'Bearer ' + t);
                input = new Request(input, { headers: h });
            } else {
                init = init || {};
                if (init.headers instanceof Headers) {
                    init.headers.set('Authorization', 'Bearer ' + t);
                } else if (Array.isArray(init.headers)) {
                    init.headers = init.headers.filter(function (kv) { return kv[0].toLowerCase() !== 'authorization'; });
                    init.headers.push(['Authorization', 'Bearer ' + t]);
                } else {
                    init.headers = Object.assign({}, init.headers || {});
                    // Remove any case-variant of Authorization before setting ours
                    Object.keys(init.headers).forEach(function (k) {
                        if (k.toLowerCase() === 'authorization') delete init.headers[k];
                    });
                    init.headers['Authorization'] = 'Bearer ' + t;
                }
            }
        }
        return originalFetch(input, init).then(function (resp) {
            if (resp.status === 401 && t && isApi) {
                localStorage.removeItem('access_token');
                location.href = '/app/login?returnTo=scalar';
            }
            return resp;
        });
    };

    var token = getToken();

    // Scalar 1.5x mounts via Scalar.createApiReference(target, config).
    Scalar.createApiReference("#app", {
        sources: [
            { url: "/api/v3/api-docs/client",  title: "SPA / Swing client",     slug: "client",  default: true },
            { url: "/api/v3/api-docs/auth",    title: "Authentication & OIDC",  slug: "auth"  },
            { url: "/api/v3/api-docs/rest",    title: "Public REST API",        slug: "rest"  },
            { url: "/api/v3/api-docs/exports", title: "Imports / Exports",      slug: "exports" }
        ],
        theme: "default",
        layout: "modern",
        showSidebar: true,
        metaData: { title: "Rapla REST API" },
        // PRD 035: shared OAuth via SPA. Override the spec's oauth2 scheme
        // with a bearer scheme pre-filled from localStorage.access_token.
        // No in-UI OAuth flow, no /scalar/index.html callback URI to register.
        authentication: {
            preferredSecurityScheme: "bearer",
            securitySchemes: {
                bearer: {
                    type: "http",
                    scheme: "bearer",
                    token: token || ""
                }
            }
        }
    });
</script>
<!-- Pinned to 1.57.1 (latest as of 2026-05-16). Bump deliberately — Scalar releases
     frequently and major versions can break the data-configuration shape. -->
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.57.1"></script>
</body>
</html>
