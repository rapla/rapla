server:
  port: 8051
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/css,text/javascript,application/javascript
  # Honour X-Forwarded-{Host,Port,Proto} on incoming requests. Lets the dev
  # `ng serve` proxy (rapla-angular/proxy.conf.js with `xfwd: true`) tell Spring
  # the request originally came from :4200, so OAuthConfigController returns
  # :4200 URLs and the SPA can use them as same-origin (proxy-friendly).
  # In prod behind a reverse proxy / load balancer this also produces correct
  # absolute URLs when responses include the scheme/host/port.
  forward-headers-strategy: FRAMEWORK
  # Context-path dropped 2026-05-12 per PRD 031 Phase 1. Historical /rapla/ prefix
  # was a servlet name carried forward from WAR-deployment days; new layout puts
  # the SPA at /app/, REST under /api/ (Phase 2), and anchors only the six
  # load-bearing legacy URLs (/rapla/calendar, /rapla/ical, etc.) explicitly via
  # class-level @RequestMapping in CalendarPageController + Export2iCalController.

spring:
  application:
    name: rapla
  security:
    oauth2:
      authorizationserver:
        client:
          swagger-ui:
            registration:
              client-id: swagger-ui
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://localhost:8051/swagger-ui/oauth2-redirect.html
              scopes:
                - openid
                - profile
            require-proof-key: true
            require-authorization-consent: false
          # Single public OAuth client for both rapla UIs (Swing desktop and
          # Angular SPA). All loopback redirects → Spring's loopback any-port
          # match applies, so the Swing client can bind a random port and the
          # Angular dev server can run on any local port. Production deployments
          # behind a real hostname add their URI via env override:
          #   SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_CLIENT_RAPLA-CLIENT_REGISTRATION_REDIRECT-URIS_3=https://rapla.example.com/auth/callback
          rapla-client:
            registration:
              client-id: ${rapla.oauth.client-id}
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://127.0.0.1/login/oauth2/code/rapla
                - http://localhost/auth/callback
                - http://127.0.0.1/auth/callback
                # PRD 031 + 026: Angular SPA's OAuth2 callback.
                # - Loopback (no port) covers prod and any loopback port via
                #   Spring's loopback any-port match (RFC 8252 native-app convention).
                # - :4200 explicitly listed because spring-security-oauth2-authorization-server
                #   7.0.5's DEFAULT_REDIRECT_URI_VALIDATOR doesn't always apply the
                #   loopback any-port match in the issuer-side path. Same-origin
                #   matcher (allow-same-origin-redirects) doesn't help here either
                #   because the SPA's origin (:4200) differs from the AS origin (:8051).
                - http://localhost/app/auth/callback
                - http://127.0.0.1/app/auth/callback
                - http://localhost:4200/app/auth/callback
                - http://127.0.0.1:4200/app/auth/callback
              scopes:
                - openid
                - profile
                # offline_access is required for Spring Authorization Server to issue
                # refresh tokens on OIDC flows (request includes openid scope).
                # Without it, /oauth2/token returns access_token + id_token but NO refresh_token.
                - offline_access
            require-proof-key: true
            require-authorization-consent: false

rapla:
  file-datasources:
    raplafile: data/data.xml
  oauth:
    # Single public OAuth client config. Both the Swing desktop client and the
    # Angular SPA use this client_id; the redirect-uris on the matching Spring
    # `rapla-client` registration above are the only thing that differs per
    # surface. Override with RAPLA_OAUTH_CLIENT_ID=... if a deployment renames
    # the client.
    enabled: true
    client-id: rapla-client
    # Show a "paste callback URL here" dialog alongside the OAuth browser launch
    # as a fallback for environments where the automatic loopback redirect can't
    # reach the Swing client (WSL2 NAT, corporate firewalls blocking inbound
    # localhost, etc.). Off by default — most deployments don't need it. Enable
    # via RAPLA_OAUTH_SHOW_PASTE_FALLBACK=true if your users hit "site can't be
    # reached" after sign-in.
    show-paste-fallback: false
    # Dev-only convenience: accept redirect URIs whose host is in 172.16.0.0/12
    # (the default Hyper-V WSL2 bridge range) with any port, provided the path
    # matches one of the registered URIs. Lets a developer run the Swing client
    # inside WSL2 without configuring WSL2 mirrored networking. The Windows
    # browser routes directly to the WSL bridge IP, bypassing the NAT
    # forwarder. PKCE still mandatory.
    # PRODUCTION DEPLOYMENTS MUST SET THIS TO false (or unset). Set via env:
    #   RAPLA_OAUTH_ALLOW_WSL_BRIDGE_REDIRECTS=false
    allow-wsl-bridge-redirects: true
    # Production convenience: accept any redirect URI whose scheme/host/port
    # match the public origin the auth-server request came in on (honoring
    # X-Forwarded-Proto and X-Forwarded-Host when behind a reverse proxy),
    # provided the path matches one of the registered URIs. Lets a deployment
    # at https://rapla.example.com auto-accept https://rapla.example.com/auth/callback
    # for the Angular SPA without registering the deployment-specific URI in
    # this YAML. Safe because PKCE is mandatory AND the path still has to
    # match. Disable via:
    #   RAPLA_OAUTH_ALLOW_SAME_ORIGIN_REDIRECTS=false
    allow-same-origin-redirects: true

springdoc:
  # Default response media type for endpoints that don't declare `produces`
  # explicitly. Controllers without an explicit @GetMapping(produces=...) end
  # up with Accept: */* in the generated OpenAPI spec, which makes the
  # typescript-angular client treat the response as a Blob instead of parsing
  # it as JSON (Configuration.isJsonMime('*/*') == false). Setting this to
  # application/json makes responses default to JSON at both spec and runtime.
  default-produces-media-type: application/json
  swagger-ui:
    # OAuth2 code+PKCE wiring — Swagger UI's "Authorize" button calls /oauth2/authorize
    # with the pre-filled client_id and a fresh PKCE verifier on every login attempt.
    oauth:
      client-id: swagger-ui
      use-pkce-with-authorization-code-grant: true

logging:
  level:
    root: INFO
    org.rapla: INFO
    # TEMPORARY: troubleshoot auth-server form login. Remove after POC works.
    org.springframework.security: DEBUG
