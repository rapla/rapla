<app-toolbar />
<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="nav">
    <mat-nav-list class="view-switch">
      @for (v of views(); track v.name) {
        <a mat-list-item [routerLink]="['/views', v.name]" routerLinkActive="active-link">
          <mat-icon matListItemIcon>calendar_view_week</mat-icon>
          <span matListItemTitle>{{ v.title ?? v.name }}</span>
        </a>
      }
    </mat-nav-list>
    <app-resource-selection />
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="content-col">
      <app-chip-rail />
      <app-view-control-strip />
      <div class="view-host">
        <router-outlet />
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
